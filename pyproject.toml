[project]
name = "print-shop"
version = "0.1.0"
description = "The print project: an STL in, a print started behind a human gate, and a ledger of how it went"
requires-python = ">=3.12"

# Dependencies are added when the code that uses them lands, not before
# (the prototype's AGENTS.md rule 7).
dependencies = [
    "httpx>=0.27",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "numpy>=1.26",
    "paho-mqtt>=2.0",
    # The SDCP client for the Centauri Carbon 1. tests/conftest.py guards its
    # one armed door.
    "pycentauri>=0.9.1",
    "pydantic>=2.5",
    "trimesh>=4.0",
]

[dependency-groups]
dev = [
    # manifold3d backs trimesh's boolean ops, used only to build test fixtures.
    # jinja2 renders HA's value_templates as HA does; pyyaml reads ha-configs.
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "manifold3d>=2.5",
    "pytest-asyncio>=0.23",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print_shop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slicer: shells out to a real OrcaSlicer binary (deselect with -m 'not slicer')",
    "llm: calls a model through LiteLLM :4000 (deselect with -m 'not llm')",
    "mqtt: publishes to the real MQTT broker (deselect with -m 'not mqtt')",
    "ha: queries the real Home Assistant REST API (deselect with -m 'not ha')",
    "bench: runs the CAD bench in its Docker image, built by scripts/bench.py build (deselect with -m 'not bench')",
    "bench_local: runs the CAD bench on a file only the Mac holds, and skips where it's absent",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# The bench's geometry code runs in its image (src/print_shop/bench/image), and these libraries
# are there, not in this environment.
[[tool.mypy.overrides]]
module = ["cadquery.*", "cadquery", "OCP.*", "manifold3d.*", "manifold3d", "shapely.*", "shapely", "vtk.*", "vtk", "PIL.*"]
ignore_missing_imports = true
follow_imports = "skip"
