# This repository's own checks, until the crew takes it over.
#
# The template's checks.yml runs what `.crew/project.yaml` names, and that
# record's intent is the Sponsor's, written at onboarding. Until then it has
# nothing to check, so the checks run here. Nothing in CI reaches the printer,
# Home Assistant, the MQTT broker, Orca or a model: those tests carry markers
# and are deselected. No test contacts the printer at all.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src tests scripts
      - run: uv run pytest -q -m "not slicer and not llm and not mqtt and not ha and not bench and not bench_local"
      - run: uv run python scripts/check_addresses.py
      - run: uv run python scripts/check_shards.py 4 -m bench

  # The CAD bench's image, built once per push for amd64 here (arm64 on the Mac), so this is
  # also the proof it can move to an x86 machine. A pull request builds from the layers GitHub's
  # cache holds, and any change to the Dockerfile or what it copies rebuilds from that layer on.
  # A push to main reads no cache: it builds from nothing, as every push did before, and leaves
  # the layers for the pull requests after it. The test jobs load this image and check it.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - id: tag
        run: echo "tag=$(uv run python -c 'from print_shop.bench.host import IMAGE; print(IMAGE)')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: src/print_shop/bench/image
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.tag }}
          load: true
          no-cache: ${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=bench-image
          cache-to: type=gha,scope=bench-image,mode=max
      - run: uv run python scripts/bench.py check
      - run: docker save "${{ steps.tag.outputs.tag }}" | zstd -T0 -3 -o bench-image.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: bench-image
          path: bench-image.tar.zst
          compression-level: 0
          retention-days: 1

  # The `-m bench` tests on that image, in four parts at once, two tests at a time in each: a
  # runner has 4 CPUs and a bench container 2. `--shard` deals the tests the markers chose in
  # turn, and the `ci` job checks the four parts are the whole, each test in exactly one.
  bench:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          name: bench-image
      - run: zstd -d --stdout bench-image.tar.zst | docker load && rm bench-image.tar.zst
      - run: uv run python scripts/bench.py check
      - run: uv run pytest -q -m bench --shard ${{ matrix.shard }}/4 -n 2 --durations=40
