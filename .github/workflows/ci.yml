# This repository's own checks, until the crew takes it over.
#
# The template's checks.yml runs what `.crew/project.yaml` names, and that
# record's intent is the Sponsor's, written at onboarding. Until then it has
# nothing to check, so the checks run here. Nothing in CI reaches the printer,
# Home Assistant, the MQTT broker, Orca or a model: those tests carry markers
# and are deselected. No test contacts the printer at all.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src tests scripts
      - run: uv run pytest -q -m "not slicer and not llm and not mqtt and not ha and not bench and not bench_local"
      - run: uv run python scripts/check_addresses.py

  # The CAD bench on its planted cases, in its own image with no network. Built for amd64 here
  # and arm64 on the Mac, so this is also the proof it can move to an x86 machine. The `-m bench`
  # tests run in two jobs at once, each building the image, so each keeps its 30 minutes: the
  # rounds' file in one, and every other `-m bench` test in the other, chosen so none falls
  # between them.
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/bench.py build
      - run: uv run python scripts/bench.py check
      - run: uv run pytest -q -m bench --ignore=tests/test_rounds_in_image.py

  # A fake model drives real runs in real containers on the bench image.
  rounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/bench.py build
      - run: uv run python scripts/bench.py check
      - run: uv run pytest -q -m bench tests/test_rounds_in_image.py
